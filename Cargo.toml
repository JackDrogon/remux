[package]
name = "remux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jack Drogon"]

[lints.rust]
unused_must_use = "deny"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
chrono = { version = "0.4", default-features = true, features = ["clock"] }
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
