name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux

      - name: Install repository tools
        uses: taiki-e/install-action@v2.75.22
        with:
          tool: dprint@0.53.2,cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check repository formatting
        run: dprint check README.md .github/workflows/ci.yml Cargo.toml .config/nextest.toml

      - name: Run typos
        uses: crate-ci/typos@v1.35.5

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo nextest run --profile ci --all-features

      - name: Run doctests
        run: cargo test --doc --all-features

      - name: Run tmux-backed integration tests
        run: cargo nextest run --profile ci --test live_tmux --run-ignored only --no-capture
